services:
  - type: web
    name: getshure
    runtime: static
    repo: https://github.com/MYTRACK-HOLDINC-LLC/getshure
    branch: main
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
